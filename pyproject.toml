[project]
name = "sixsentences-engine"
version = "0.2.0a1"
description = "Open building blocks for auditable research workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "SixSentences contributors" }]
keywords = [
    "data-analysis",
    "evidence-synthesis",
    "information-retrieval",
    "open-science",
    "openalex",
    "prisma",
    "reproducible-research",
    "research-data",
    "research-software",
    "systematic-review",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "duckdb==1.5.4",
    "httpx==0.28.1",
    "pydantic==2.13.4",
]

[project.scripts]
sixsentences = "sixsentences.cli:main"

[project.urls]
Homepage = "https://sixsentences.com"
Documentation = "https://github.com/SixSentences/sixsentences#readme"
Issues = "https://github.com/SixSentences/sixsentences/issues"
Repository = "https://github.com/SixSentences/sixsentences"
Changelog = "https://github.com/SixSentences/sixsentences/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.15.21",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sixsentences"]

[tool.hatch.build.targets.sdist]
include = [
    "/.github/scripts/*.py",
    "/src",
    "/tests",
    "/docs/assets/sixsentences-mark.svg",
    "/*.md",
    "/CITATION.cff",
    "/DCO",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sixsentences"]
