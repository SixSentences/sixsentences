[project]
name = "sixsentences-engine"
version = "0.1.0a1"
description = "Audit-friendly building blocks for systematic literature search"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "SixSentences contributors" }]
keywords = [
    "evidence-synthesis",
    "information-retrieval",
    "openalex",
    "prisma",
    "systematic-review",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "duckdb==1.5.5",
    "httpx==0.28.1",
    "pydantic==2.13.5",
]

[project.scripts]
sixsentences = "sixsentences.cli:main"

[project.urls]
Documentation = "https://github.com/SixSentences/sixsentences#readme"
Issues = "https://github.com/SixSentences/sixsentences/issues"
Repository = "https://github.com/SixSentences/sixsentences"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sixsentences"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/*.md",
    "/CITATION.cff",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sixsentences"]
