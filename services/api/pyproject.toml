[project]
name = "sixsentences-community-api"
version = "0.2.0a1"
description = "Self-hosted community API for auditable research workspaces"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = [
    "alembic==1.18.5",
    "fastapi==0.139.0",
    "httpx==0.28.1",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pypdf==6.16.2",
    "sixsentences-engine==0.2.0a1",
    "sqlalchemy==2.0.51",
    "uvicorn==0.51.0",
    "websockets==16.1.1",
]

[project.scripts]
six-community = "sixsentences_server.cli:main"
six-community-worker = "sixsentences_server.worker:main"

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.15.21",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sixsentences_server"]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "sixsentences_server/_alembic"
"alembic.ini" = "sixsentences_server/_alembic.ini"

[tool.uv.sources]
sixsentences-engine = { path = "../..", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
packages = ["sixsentences_server"]
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
