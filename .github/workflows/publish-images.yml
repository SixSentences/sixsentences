name: Publish images

on:
  workflow_call:
    inputs:
      tag:
        description: Signed release tag with a reviewed draft
        required: true
        type: string
      release_sha:
        description: Exact source commit already verified by the release caller
        required: true
        type: string

concurrency:
  group: publish-images-${{ inputs.tag }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: Verify signed image source and editable release draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # GitHub hides drafts from read-only tokens. This job reads, never mutates, the release.
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      epoch: ${{ steps.source.outputs.epoch }}
      owner: ${{ steps.source.outputs.owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify signed main ancestor, caller source and release draft
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = refs/heads/main
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Unsupported release tag syntax." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The release caller did not supply a full source commit." >&2
            exit 1
          fi
          git config --local gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/release-maintainers.allowed_signers"
          git verify-tag "$RELEASE_TAG"
          sha="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          test "$sha" = "$EXPECTED_RELEASE_SHA"
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          test "$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft --jq .isDraft)" = true
          git worktree add --detach "$RUNNER_TEMP/image-source" "$sha"
          python .github/scripts/release.py validate --root "$RUNNER_TEMP/image-source" --tag "$RELEASE_TAG" --main-ref refs/remotes/origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct "$sha")" >> "$GITHUB_OUTPUT"
          echo "owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  images:
    name: Build and verify digest-bound community images and SBOMs
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: community-release
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
      IMAGE_PREFIX: ghcr.io/${{ needs.validate.outputs.owner }}/community
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Initialize isolated builder and registry authentication
        env:
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker buildx create --name community-release --driver docker-container --use
          docker buildx inspect --bootstrap
          mkdir image-evidence
      - name: Build and publish only new immutable version references
        id: built-images
        run: |
          set -euo pipefail
          api="$IMAGE_PREFIX-api:$RELEASE_TAG"
          web="$IMAGE_PREFIX-web:$RELEASE_TAG-localhost"
          for image in "$api" "$web"; do
            if probe="$(docker buildx imagetools inspect "$image" 2>&1)"; then
              echo "Refusing to replace an existing image tag; use a new release." >&2
              exit 1
            elif [[ "$probe" != "ERROR: $image: not found" ]]; then
              echo "Registry absence was not confirmed; refusing to publish." >&2
              exit 1
            fi
          done
          common=(--platform linux/amd64 --sbom=true --provenance=mode=max --push
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
            --label "org.opencontainers.image.revision=$RELEASE_SHA"
            --label "org.opencontainers.image.version=$RELEASE_TAG"
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY")
          docker buildx build "${common[@]}" --tag "$api" --file services/api/Dockerfile --metadata-file image-evidence/api.build.json .
          docker buildx build "${common[@]}" --tag "$web" --file apps/web/Dockerfile --metadata-file image-evidence/web.build.json \
            --build-arg NEXT_PUBLIC_SIX_API_URL=http://localhost/api \
            --build-arg NEXT_PUBLIC_APP_URL=http://localhost \
            --build-arg NEXT_PUBLIC_LEGAL_BASE_URL=http://localhost/legal \
            --build-arg SIX_ALLOW_INSECURE_LOCAL_HTTP=true \
            --build-arg NEXT_PUBLIC_TERMS_VERSION=community-operator-v1 \
            --build-arg NEXT_PUBLIC_PRIVACY_VERSION=community-operator-v1 \
            --build-arg NEXT_PUBLIC_DPA_VERSION=community-operator-v1 apps/web
          for kind in api web; do
            digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "image-evidence/$kind.build.json")"
            ref="$IMAGE_PREFIX-$kind@$digest"
            docker buildx imagetools inspect "$ref" --format '{{json .SBOM}}' > "image-evidence/$kind.sbom.json"
            docker buildx imagetools inspect "$ref" --format '{{json .Provenance}}' > "image-evidence/$kind.provenance.json"
            docker pull "$ref"
            docker image inspect "$ref" --format '{{json .Config.Labels}}' > "image-evidence/$kind.identity.json"
            printf '%s\n' "$ref" >> image-evidence/IMAGE_DIGESTS
            printf '%s=%s\n' "$kind" "$ref" >> "$GITHUB_OUTPUT"
          done
      - name: Scan the exact published API digest for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.built-images.outputs.api }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          hide-progress: true
          version: v0.69.3
      - name: Scan the exact published web digest for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.built-images.outputs.web }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          hide-progress: true
          version: v0.69.3
      - name: Exercise the exact published digests before advertising their evidence
        run: |
          set -euo pipefail
          api="$(sed -n '1p' image-evidence/IMAGE_DIGESTS)"
          web="$(sed -n '2p' image-evidence/IMAGE_DIGESTS)"
          python deploy/community/rehearse.py --confirm DISPOSABLE \
            --api-image "$api" --web-image "$web" \
            --upgrade-from ghcr.io/sixsentences/community-api@sha256:31b374cfb4b45c2cceb6a609d3b0ec8853ee47cd0a3d1588dfa48305bcb3498d \
            --report image-evidence/runtime-rehearsal.json
      - name: Validate SBOMs and write checksummed public evidence
        run: python .github/scripts/image_evidence.py --directory image-evidence --tag "$RELEASE_TAG" --revision "$RELEASE_SHA"
      - name: Retain validated image evidence before final release publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: community-image-evidence-${{ inputs.tag }}
          path: |
            image-evidence/IMAGE_DIGESTS
            image-evidence/IMAGE_SHA256SUMS
            image-evidence/images.json
            image-evidence/api.sbom.json
            image-evidence/web.sbom.json
            image-evidence/api.provenance.json
            image-evidence/web.provenance.json
            image-evidence/api.identity.json
            image-evidence/web.identity.json
            image-evidence/runtime-rehearsal.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false
      - name: Remove registry credentials and disposable builder
        if: always()
        run: |
          docker logout ghcr.io
          docker buildx rm community-release || true
