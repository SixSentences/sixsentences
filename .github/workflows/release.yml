name: Release community prerelease

on:
  push:
    tags:
      - "v*-alpha.*"
      - "v*-beta.*"
      - "v*-rc.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Validate and build Python engine artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      package-version: ${{ steps.metadata.outputs.package-version }}
      public-version: ${{ steps.metadata.outputs.public-version }}
    steps:
      - name: Check out the complete tagged history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up pinned uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          version: "0.10.12"
          enable-cache: false
      - name: Validate tag and release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python .github/scripts/release.py validate \
            --tag "$RELEASE_TAG" \
            --main-ref refs/remotes/origin/main \
            --github-output "$GITHUB_OUTPUT"
      - name: Install the frozen development environment
        run: uv sync --frozen --group dev
      - name: Run the release quality gate
        run: |
          uv run ruff check src tests .github/scripts
          uv run ruff format --check src tests .github/scripts
          uv run mypy src/sixsentences
          uv run pytest -q
      - name: Build one source distribution
        env:
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.source-date-epoch }}
        run: uv build --sdist --out-dir release --no-create-gitignore
      - name: Build one wheel from the source distribution
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package-version }}
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.source-date-epoch }}
        run: |
          uv build \
            "release/sixsentences_engine-${PACKAGE_VERSION}.tar.gz" \
            --wheel \
            --out-dir release \
            --no-create-gitignore
      - name: Generate the locked runtime SBOM
        env:
          PUBLIC_VERSION: ${{ steps.metadata.outputs.public-version }}
        run: |
          uv export \
            --frozen \
            --no-dev \
            --preview-features sbom-export \
            --format cyclonedx1.5 \
            --output-file "release/sixsentences-engine-${PUBLIC_VERSION}.cdx.json"
      - name: Add and validate release metadata
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package-version }}
          PUBLIC_VERSION: ${{ steps.metadata.outputs.public-version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp -- "docs/releases/${RELEASE_TAG}.md" release/RELEASE_NOTES.md
          python .github/scripts/release.py finalize \
            --directory release \
            --package-version "$PACKAGE_VERSION" \
            --public-version "$PUBLIC_VERSION"
      - name: Preserve the Python engine release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-engine-release-candidate-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false

  verify:
    name: Install and verify Python engine artifacts
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out release verification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-engine-release-candidate-${{ github.ref_name }}
          path: release
      - name: Set up pinned uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          version: "0.10.12"
          enable-cache: false
      - name: Verify release checksums
        run: python .github/scripts/release.py verify-checksums --directory release
      - name: Smoke-test the wheel in isolation
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.package-version }}
        run: |
          uv run --isolated --no-project --python 3.12 \
            --with "./release/sixsentences_engine-${PACKAGE_VERSION}-py3-none-any.whl" \
            python -I -c \
            "from importlib.metadata import version; import sixsentences; assert version('sixsentences-engine') == '${PACKAGE_VERSION}'; assert sixsentences.__version__ == '${PACKAGE_VERSION}'"
          uv run --isolated --no-project --python 3.12 \
            --with "./release/sixsentences_engine-${PACKAGE_VERSION}-py3-none-any.whl" \
            sixsentences --help
      - name: Smoke-test the source distribution in isolation
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.package-version }}
        run: |
          uv run --isolated --no-project --python 3.12 \
            --with "./release/sixsentences_engine-${PACKAGE_VERSION}.tar.gz" \
            python -I -c \
            "from importlib.metadata import version; import sixsentences; assert version('sixsentences-engine') == '${PACKAGE_VERSION}'; assert sixsentences.__version__ == '${PACKAGE_VERSION}'"
          uv run --isolated --no-project --python 3.12 \
            --with "./release/sixsentences_engine-${PACKAGE_VERSION}.tar.gz" \
            sixsentences --help

  attest:
    name: Attest Python engine provenance and SBOM
    needs: [build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Restore the verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-engine-release-candidate-${{ github.ref_name }}
          path: release
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Attest the runtime SBOM for both Python distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/sixsentences_engine-${{ needs.build.outputs.package-version }}-py3-none-any.whl
            release/sixsentences_engine-${{ needs.build.outputs.package-version }}.tar.gz
          sbom-path: release/sixsentences-engine-${{ needs.build.outputs.public-version }}.cdx.json

  application-api:
    name: Validate tagged application API and worker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/api
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "42"
      UV_PROJECT_ENVIRONMENT: /tmp/sixsentences-release-api-env
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          version: "0.10.12"
          enable-cache: false
      - name: Install the frozen API environment
        run: uv sync --frozen --group dev
      - name: Run API quality, test, and boundary gates
        run: |
          uv run --frozen --no-sync ruff check src scripts tests
          uv run --frozen --no-sync mypy src
          uv run --frozen --no-sync pytest -q
          uv run --frozen --no-sync python scripts/audit_boundary.py
          uv run --frozen --no-sync python scripts/check_web_contracts.py --require-complete

  web-source:
    name: Validate tagged web source (not a published artifact)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_BROWSER_CAPTURE_STORE_URL: ""
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
      NEXT_PUBLIC_LEGAL_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_TERMS_VERSION: test-v1
      NEXT_PUBLIC_PRIVACY_VERSION: test-v1
      NEXT_PUBLIC_DPA_VERSION: test-v1
      NEXT_PUBLIC_SIX_API_URL: http://127.0.0.1:8000
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.9.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install the locked web environment
        run: npm ci
      - name: Type-check the tagged web source
        run: npm run typecheck
      - name: Test every tagged web test file
        run: node --test tests/*.test.mjs
      - name: Build the tagged web source for production
        run: npm run build

  self-hosting:
    name: Validate tagged self-hosting and container builds
    needs: [application-api, web-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test deployment scripts and boundaries
        run: bash deploy/community/test.sh
      - name: Generate and validate disposable local configuration
        run: |
          bash deploy/community/init-env.sh --local --output "$RUNNER_TEMP/selfhost.env"
          bash deploy/community/preflight.sh "$RUNNER_TEMP/selfhost.env"
      - name: Build the tagged API image
        run: docker build --tag sixsentences-community-api:${{ github.ref_name }} --file Dockerfile .
      - name: Build the tagged origin-specific web image
        run: |
          docker build \
            --tag sixsentences-community-web:${{ github.ref_name }} \
            --file apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_SIX_API_URL=http://127.0.0.1/api \
            --build-arg NEXT_PUBLIC_APP_URL=http://127.0.0.1 \
            --build-arg NEXT_PUBLIC_LEGAL_BASE_URL=http://127.0.0.1/legal \
            --build-arg SIX_ALLOW_INSECURE_LOCAL_HTTP=true \
            --build-arg NEXT_PUBLIC_TERMS_VERSION=release-test-v1 \
            --build-arg NEXT_PUBLIC_PRIVACY_VERSION=release-test-v1 \
            --build-arg NEXT_PUBLIC_DPA_VERSION=release-test-v1 \
            apps/web

  publish:
    name: Publish community source prerelease with engine artifacts
    needs: [build, attest, self-hosting]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Restore the attested release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-engine-release-candidate-${{ github.ref_name }}
          path: release
      - name: Recheck artifact checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Verify the reviewed product-preview draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft' > "$RUNNER_TEMP/release-is-draft"; then
            echo "A draft release with the reviewed preview asset is required." >&2
            exit 1
          fi
          if [[ "$(<"$RUNNER_TEMP/release-is-draft")" != "true" ]]; then
            echo "Refusing to modify an already-published release." >&2
            exit 1
          fi

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' > "$RUNNER_TEMP/release-draft-assets"
          if [[ "$(wc -l < "$RUNNER_TEMP/release-draft-assets" | tr -d ' ')" != "1" ]] \
            || ! grep -Fxq 'sixsentences-overview.gif' "$RUNNER_TEMP/release-draft-assets"; then
            echo "The draft must contain only sixsentences-overview.gif before publication." >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/release-preview"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern sixsentences-overview.gif \
            --dir "$RUNNER_TEMP/release-preview"
          (
            cd "$RUNNER_TEMP/release-preview"
            sha256sum --check "$GITHUB_WORKSPACE/docs/assets/sixsentences-overview.sha256"
          )
      - name: Publish the immutable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          {
            printf '%s\n' \
              '> [!NOTE]' \
              '> This release publishes the complete tagged community application source. The downloadable, attested build artifacts below cover the `sixsentences-engine` Python distribution. API and web containers are validated from the tag but remain deployment-built so configuration is explicit.' \
              ''
            cat release/RELEASE_NOTES.md
          } > "$RUNNER_TEMP/release-notes.md"

          if [[ "$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft')" != "true" ]]; then
            echo "The verified release draft is no longer editable." >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" \
            release/*.whl \
            release/*.tar.gz \
            release/*.cdx.json \
            release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft=false \
            --prerelease \
            --latest=false \
            --title "SixSentences ${RELEASE_TAG} · community source + engine artifacts" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
