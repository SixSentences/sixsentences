name: Bug report
description: Report reproducible incorrect behavior in the open-source project.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Remove secrets, personal data, copyrighted full text, and production details before submitting. Use the private security advisory flow for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Component and version
      description: Name the affected component (web application or Python engine) and provide the release version or full commit hash.
      placeholder: 0.1.0-alpha.1 or 0123456789abcdef...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include relevant Python and/or Node.js versions, operating system, architecture, browser, and installation method.
      placeholder: Web app, Node.js 22.9.0, Firefox 142, macOS arm64, npm
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest synthetic input and exact command or code that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized output or traceback when useful.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mention the affected app route or engine command, data-source terms, provider configuration, or recent dependency changes when relevant. Do not include credentials or hosted-production details.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I reproduced this against a supported version or current `main`.
          required: true
        - label: This report contains no secret, personal data, private corpus record, or production detail.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
