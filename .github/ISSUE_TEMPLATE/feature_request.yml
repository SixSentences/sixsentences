name: Feature proposal
description: Propose a focused addition to the community application or Python engine.
title: "proposal: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Proposals should solve a concrete open-source workflow problem. The current repository includes the web application source and the Python research engine, but not a complete self-hosted backend. Hosted billing, operations, customer configuration, and production evidence stay out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow limitation exists, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe inputs, outputs, failure modes, and the smallest useful application or engine interface.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include a caller-side solution or documentation-only option where applicable.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and research-method implications
      description: Note schema changes, statistical assumptions, migration needs, and claims that require evidence.
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, network, and data terms
      description: Identify any proposed package, service, corpus, license, rate limit, or privacy boundary.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: This proposal fits the community source tree and does not require hosted-production secrets, customer data, billing, or operations.
          required: true
        - label: I searched existing issues and discussions for the same proposal.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
