version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      runtime-dependencies:
        applies-to: version-updates
        patterns:
          - duckdb
          - httpx
          - pydantic
        update-types:
          - minor
          - patch
      development-dependencies:
        applies-to: version-updates
        patterns:
          - mypy
          - pytest
          - ruff
        update-types:
          - minor
          - patch
      build-dependencies:
        applies-to: version-updates
        patterns:
          - hatchling
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /services/api
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:22"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: sixsentences-engine
    groups:
      community-runtime-dependencies:
        applies-to: version-updates
        patterns:
          - httpx
          - pillow
          - pydantic
          - pypdf
        update-types:
          - minor
          - patch
      community-development-dependencies:
        applies-to: version-updates
        patterns:
          - mypy
          - pytest
          - ruff
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:32"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /apps/web
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:33"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:37"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/web
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:27"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/browser-extension
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:28"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: swift
    directory: /apps/companion-macos
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:29"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
