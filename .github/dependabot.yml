version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      runtime-dependencies:
        applies-to: version-updates
        patterns:
          - duckdb
          - httpx
          - pydantic
        update-types:
          - minor
          - patch
      development-dependencies:
        applies-to: version-updates
        patterns:
          - mypy
          - pytest
          - ruff
        update-types:
          - minor
          - patch
      build-dependencies:
        applies-to: version-updates
        patterns:
          - hatchling
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /services/api
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:22"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: sixsentences-engine
      # anthropic 1.x moves the SDK to httpx2, which would put a second HTTP
      # stack and a second TLS trust store in the same image as the 21 call
      # sites behind the SSRF guard. That is an architecture decision, tracked
      # in #77; until it is made, a weekly pull request only adds noise.
      - dependency-name: anthropic
        update-types:
          - version-update:semver-major
    groups:
      community-runtime-dependencies:
        applies-to: version-updates
        patterns:
          - httpx
          - pillow
          - pydantic
          - pypdf
        update-types:
          - minor
          - patch
      community-development-dependencies:
        applies-to: version-updates
        patterns:
          - mypy
          - pytest
          - ruff
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:32"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /apps/web
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:33"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The Node major is declared in ci.yml, package.json engines, this
      # Dockerfile and @types/node. Moving one of them publishes an image on a
      # runtime no test exercises, so they move together, in #97.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:37"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/web
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:27"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # react-pdf 11 turns on Suspense across the three viewers and takes PDF.js
      # to 6, which can move the text-layer DOM that review-pdf.tsx selects on.
      # A migration with hand verification, tracked in #98.
      - dependency-name: react-pdf
        update-types:
          - version-update:semver-major
      # Follows whichever Node major the project settles on in #97, not its own
      # release cadence.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      web-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/browser-extension
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:28"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: swift
    directory: /apps/companion-macos
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:29"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
