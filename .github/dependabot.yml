version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      runtime-dependencies:
        applies-to: version-updates
        patterns:
          - duckdb
          - httpx
          - pydantic
        update-types:
          - minor
          - patch
      development-dependencies:
        applies-to: version-updates
        patterns:
          - mypy
          - pytest
          - ruff
        update-types:
          - minor
          - patch
      build-dependencies:
        applies-to: version-updates
        patterns:
          - hatchling
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:37"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "05:27"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
